    <!-- Window.fetch getter/setter compatibility shim for sandbox / iframe environments -->
    <script>
      (function() {
        try {
          var nativeFetch = window.fetch;
          var customFetch = nativeFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch || nativeFetch;
            },
            set: function(fn) {
              customFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e1) {
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              var protoFetch = Window.prototype.fetch;
              var customProtoFetch = protoFetch;
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return customProtoFetch || protoFetch;
                },
                set: function(fn) {
                  customProtoFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e2) {}
        }

        // Global uncaught error filter for any external tool/extension attempting to set read-only fetch
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('fetch') !== -1 && event.message.indexOf('getter') !== -1) {
            event.preventDefault();
            if (event.stopImmediatePropagation) {
              event.stopImmediatePropagation();
            }
            return true;
          }
        });
      })();
